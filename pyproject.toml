[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judgment-compilation"
version = "0.1.0"
description = "A local tool for inspecting source documents and running compiled checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyMuPDF==1.28.0"]

[project.urls]
Repository = "https://github.com/MBACCARO-DEV/judgment-compilation-prototype"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
jc = "judgment_compilation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["judgment_compilation*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra -m "not corpus_integrity"'
markers = [
  "corpus_integrity: expensive checks that independently re-read the frozen source corpus",
]
